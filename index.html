<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FlowState</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3d5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3d5ba9">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&family=Lexend:wght@400;600&family=Caveat:wght@500;700&family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--text:#1d2440;--cal:#3d5ba9;--font:system-ui,sans-serif;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);font-size:var(--fs);color:var(--text);background:#f5e6e1;transition:background .4s}
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;height:100%}
#rail{width:112px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0;background:rgba(70,60,75,.35);border-radius:0 46px 46px 0;overflow:hidden}
#rail button{width:84px;height:84px;flex:none;border-radius:50%;border:4px solid #3a3440;font-size:34px;background:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .25s;padding:0}
#rail button.active{transform:scale(1.12);border-color:#000;box-shadow:0 0 0 4px #ffd45c}
#rail.collapsed{justify-content:flex-start}
#rail.collapsed button:not(.active){display:none}
#rail.drop button{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.logo{font-weight:900;font-size:30px;letter-spacing:1px;background:linear-gradient(90deg,#ff7a59,#c44cc9,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;align-items:center;gap:12px}
#clock{background:#111;color:#fff;font-family:monospace;font-size:20px;padding:4px 10px;border-radius:6px}
header button{background:none;border:0;font-size:26px;position:relative;cursor:pointer;padding:4px}
#badge{position:absolute;top:-4px;right:-6px;background:#e33;color:#fff;border-radius:10px;font-size:12px;padding:0 5px;font-style:normal}
#badge:empty{display:none}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#view{flex:1;overflow:auto;padding:6px 18px 120px}
h1{margin:6px 0 12px;font-size:1.9em}
h2{margin:0 0 10px}
h3{margin:0 0 8px}
.panel{background:rgba(255,255,255,.85);border:3px solid var(--cal);border-radius:18px;padding:14px;margin-bottom:14px;overflow:auto}
.panel.tall{min-height:420px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.12);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card small{display:block;opacity:.7}
.card.done{opacity:.5;text-decoration:line-through}
.chk{width:34px;height:34px;flex:none;border-radius:8px;padding:0}
.grow{flex:1;min-width:0}
.empty{opacity:.6;font-style:italic}
.body{white-space:pre-wrap;background:#faf7f7;border-radius:10px;padding:8px;margin-top:6px;overflow-wrap:anywhere}
.body.clamped{max-height:300px;overflow:hidden;position:relative;mask-image:linear-gradient(#000 78%,transparent);-webkit-mask-image:linear-gradient(#000 78%,transparent)}
.expbtn{display:inline-block;margin-top:6px;padding:5px 12px;font-size:.85em;border-radius:16px;background:#fff;border:2px solid var(--cal);cursor:pointer}
textarea{min-height:170px;max-height:none;resize:vertical}
textarea.grow{overflow:hidden;resize:none}
button{font:inherit;border-radius:12px;border:2px solid var(--cal);background:#fff;padding:8px 14px;color:var(--text);cursor:pointer}
button.primary{background:var(--cal);color:#fff}
button.danger{color:#c00;border-color:#c00}
button.big{display:block;width:100%;margin:8px 0;font-size:1.1em;padding:14px;text-align:left}
button.chip{border-radius:20px;padding:6px 12px}
button.chip.on{background:var(--cal);color:#fff}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff}
.sw.on{outline:3px solid #000}
input,textarea,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid #bbb;margin:6px 0;background:#fff;color:#222}
input[type=range],input[type=color],input[type=checkbox]{width:auto}
input[type=color]{height:40px;padding:2px}
textarea{min-height:170px}
label{display:block;margin:6px 0}
label.chip{display:inline-flex;align-items:center;gap:4px;width:auto;padding:6px 10px;border:2px solid var(--cal);border-radius:20px;margin:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
#fab{position:absolute;right:22px;bottom:18px;width:74px;height:74px;border-radius:50%;background:#111;color:#fff;font-size:44px;border:4px solid #2fd46b;padding:0;line-height:1}
#schoolBtn{position:absolute;right:112px;bottom:26px;width:62px;height:62px;border-radius:50%;background:#f7d28a;padding:0;font-size:30px;display:none}
#schoolBtn.on{display:block}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
#sheet.on{display:flex}
.box{background:#fbf7f6;color:var(--text);border-radius:20px;padding:20px;width:min(640px,92vw);max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:30;gap:12px;align-items:center}
#toast.on{display:flex}
#toast button{background:#fff;color:#222;border:0;padding:6px 12px}
#bubble{position:fixed;display:none;z-index:15;background:#fff;border:3px solid var(--cal);border-radius:18px;padding:12px 14px;width:260px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#bubble p{margin:4px 0}
#bubble button{margin:4px 4px 0 0;padding:6px 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:20px 10px}
.blob{position:relative;aspect-ratio:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid rgba(0,0,0,.55);border-radius:58% 42% 55% 45%/46% 56% 44% 54%;transition:transform .4s,opacity .4s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.blob.pushed{transform:translateX(70px);opacity:.55}
.blob .ico{font-size:46px}
.blob b{font-size:1.2em}
.home{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.sticky-col{display:flex;flex-direction:column;gap:14px}
.sticky{background:#fff6a8;padding:12px;box-shadow:0 4px 8px rgba(0,0,0,.2);border-radius:6px}
.sticky:nth-child(2){transform:rotate(1deg)}
.sticky:nth-child(3){transform:rotate(-1deg)}
.cal{background:rgba(255,255,255,.92);border:4px solid var(--cal);border-radius:24px;padding:14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font-size:1.4em}
.calhead button{padding:4px 14px;font-size:1.3em}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{font-weight:700;opacity:.7}
.day{position:relative;padding:10px 0;border-radius:10px;background:#f4eeee;border:0;font-size:1.05em}
.day.today{outline:3px solid var(--cal)}
.day.sel{background:var(--cal);color:#fff}
.day i{position:absolute;bottom:2px;right:4px;font-size:10px;font-style:normal;background:#e33;color:#fff;border-radius:8px;padding:0 4px}
.dl{margin:12px 0 4px}
.dayList{max-height:240px;overflow:auto}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wkcol{text-align:left;min-height:150px;background:#f4eeee;border:0;padding:6px;font-size:.9em;overflow:hidden}
.wkcol.sel{outline:3px solid var(--cal)}
.wkit{font-size:.85em;background:#fff;border-radius:6px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#view.enter{animation:viewIn .35s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.box{animation:pop .22s ease-out}
.blob .ico{
  display:flex;justify-content:center;align-items:center;
  width:76%;height:76%;min-width:0;min-height:0;
  overflow:hidden;border-radius:50%;font-size:46px;
}
.blob .ico img{
  display:block;width:100%;height:100%;max-width:100%;max-height:100%;
  aspect-ratio:1;object-fit:cover;object-position:center;
  border-radius:50%;flex:none;
}
#rail img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%}
/* ---- class books ---- */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding:14px 4px}
.book{position:relative;aspect-ratio:1/1.32;border-radius:8px 14px 14px 8px;overflow:hidden;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.28);transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;justify-content:flex-end;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-left:12px solid rgba(0,0,0,.28)}
.book:active{transform:scale(.97)}
.book.dragging{opacity:.4}
.book.dropzone{outline:3px dashed var(--cal);outline-offset:3px}
.book .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.18) 52%,rgba(0,0,0,0) 78%)}
.book .spine{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.14));pointer-events:none}
.book .bmeta{position:relative;padding:12px 14px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:2}
.book .bmeta b{display:block;font-size:1.15em;line-height:1.2}
.book .bmeta small{opacity:.9;font-size:.78em}
.book .bico{position:absolute;top:10px;right:12px;font-size:30px;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.book .stickers{position:absolute;inset:0;pointer-events:none;z-index:1}
.book .stickers span{position:absolute;font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.book .bcount{position:absolute;top:10px;left:16px;background:rgba(0,0,0,.55);color:#fff;border-radius:12px;padding:2px 9px;font-size:.72em;z-index:2}
.book .reorder{position:absolute;bottom:8px;right:8px;z-index:3;display:flex;gap:4px}
.book .reorder button{width:34px;height:34px;padding:0;border-radius:50%;font-size:15px;background:rgba(255,255,255,.92);border:2px solid rgba(0,0,0,.35);line-height:1}
/* ---- in-app browser ---- */
.brw{display:flex;flex-direction:column;gap:10px;height:100%}
.brwbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brwbar button{width:46px;height:46px;padding:0;font-size:20px;border-radius:50%;flex:none}
.brwbar input{flex:1;min-width:180px;margin:0}
.brwframe{flex:1;min-height:420px;border:3px solid var(--cal);border-radius:16px;overflow:hidden;background:#fff;position:relative}
.brwframe iframe{width:100%;height:100%;border:0;display:block;min-height:420px}
.brwnote{background:#fff6a8;border-radius:10px;padding:10px;font-size:.9em}
.bmk{display:flex;align-items:center;gap:10px}
.bmk .fav{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#eee;flex:none}
/* ---- decorative widgets ---- */
.widget{position:relative;border-radius:16px;overflow:hidden;background:#eee;box-shadow:0 4px 12px rgba(0,0,0,.16);display:flex;align-items:flex-end;min-height:150px}
.widget img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.widget .wq{position:relative;z-index:2;padding:14px;color:#fff;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.85);line-height:1.35}
.widget .wq small{display:block;font-weight:400;opacity:.85;margin-top:6px}
.widget.w-quote{background:linear-gradient(135deg,#c44cc9,#ff7a59);align-items:center;justify-content:center;text-align:center}
.widget.w-quote .wq{color:#fff}
.wsize-s{min-height:110px}.wsize-m{min-height:170px}.wsize-l{min-height:250px}
/* ---- quick add + focus + search ---- */
.qfab{position:absolute;right:22px;bottom:104px;width:60px;height:60px;border-radius:50%;background:#2fd46b;color:#fff;font-size:30px;border:4px solid #111;padding:0;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.3)}
body.focusmode #rail,body.focusmode #schoolBtn,body.focusmode .qfab{display:none}
body.focusmode #main{max-width:1100px;margin:0 auto}
body.focusmode .sticky{display:none}
.srch{display:flex;flex-direction:column;gap:8px}
.srchres .card{cursor:pointer}
[data-tip]{position:relative}
.tipwrap{position:relative;display:inline-block}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash .panel{margin-bottom:0}
.dash .hidden-sec{opacity:.45}
@media(max-width:820px){.books{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.cols,.home,.dash{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}#rail{width:88px}#rail button{width:66px;height:66px;font-size:27px}}
</style>
</head>
<body>
<canvas id="blobs"></canvas>
<div id="app">
  <nav id="rail"></nav>
  <section id="main">
    <header>
      <div class="logo">FlowState</div>
      <div class="tr">
        <span id="clock"></span>
        <button onclick="openSearch()" title="Search">🔍</button>
        <button onclick="go2('notifs')" title="Notifications">🔔<i id="badge"></i></button>
        <button onclick="go2('settings')" title="Settings">⚙️</button>
      </div>
    </header>
    <div id="view"></div>
    <button id="schoolBtn" onclick="S.cls=null;render()" title="Back to classes">🎓</button>
    <button id="fab" onclick="openMenu()" title="Add">+</button>
  </section>
</div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="box" id="sheetBody"></div></div>
<div id="toast"><span id="tmsg"></span><button id="tundo" onclick="doUndo()">Undo</button></div>
<div id="bubble"></div>
<script>
const clone=o=>JSON.parse(JSON.stringify(o));
const KEY='flowstate-v3';
const OLDKEYS=['flowstate-v2'];
const PAL=['#ff8fa3','#8fd3a8','#f7c77a','#9db4f0','#c39bf0','#7fd6e8','#f49a6b'];
const DEF={items:[],classes:[{id:'math',name:'Math',icon:'➕',color:'#ff8fa3'}],notifs:[],dnd:false,fired:{},templates:[],images:[],bookmarks:[],
  settings:{speed:1,reduce:false,font:'system-ui, sans-serif',fs:16,text:'#1d2440',cal:'#3d5ba9',
  bg:{home:'#f5e6e1',school:'#f7dede',work:'#dfe7f5',deyc:'#dcf2e2',personal:'#e5dcf5'},
  widget:{on:true,size:'m',rotate:'tab',collections:['scenic','quote'],showOn:['home']},dash:{hidden:[],order:null}}};
function migrate(x){
  const d=clone(DEF);
  const out=Object.assign(d,x,{settings:Object.assign(d.settings,x.settings||{},{bg:Object.assign(d.settings.bg,(x.settings||{}).bg||{}),bgImg:Object.assign({},(x.settings||{}).bgImg||{}),widget:Object.assign(d.settings.widget,(x.settings||{}).widget||{}),dash:Object.assign(d.settings.dash,(x.settings||{}).dash||{})})});
  out.templates=Array.isArray(x.templates)?x.templates:[];
  out.images=Array.isArray(x.images)?x.images:[];
  out.bookmarks=Array.isArray(x.bookmarks)?x.bookmarks:[];
  out.items=(x.items||[]).map(i=>Object.assign({recurrence:null,seriesId:null,exceptions:[],gcalId:null,gcalCal:null,source:'local'},i));
  out.classes=(Array.isArray(x.classes)?x.classes:d.classes).map((c,ix)=>Object.assign({order:ix,book:{cover:null,tint:null,stickers:[],subtitle:''}},c,{book:Object.assign({cover:null,tint:null,stickers:[],subtitle:''},c.book||{})}));
  return out;
}
function load(){
  let x=null;
  try{
    x=JSON.parse(localStorage.getItem(KEY));
    if(!x||!x.items){
      for(const k of OLDKEYS){const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&o.items){x=o;break}}
    }
  }catch(e){}
  if(x&&x.items)return migrate(x);
  return clone(DEF);
}
let D=load();
const S={tab:'home',cls:null,collapsed:false,bubble:null,drop:false,sel:'',month:null,view:'month'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const uid=()=>Math.random().toString(36).slice(2,10);
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>new Date(s).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const fmtDur=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const byC=(a,b)=>b.created-a.created;
const val=k=>$('#f-'+k)?.value??'';
const CATS={home:'Home',school:'School',work:'Work',deyc:'DEYC',personal:'Personal'};
const BGK=['home','school','work','deyc','personal'];
const RAIL=[['home','🏠','Home'],['school','🎓','School'],['work','💼','Work'],['deyc','🤝','DEYC'],['personal','🌟','Personal']];
const LISTS=['Must Watch','Must Read','Must Play','To Do','Websites','Potential Ideas','Games to Play'];
const LABEL={event:'Event',homework:'Homework',test:'Test',summary:'Summary',project:'Project',note:'Note',bucket:'List item',recording:'Recording'};
const WDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let FORM={},REC=null,RC='school',CCOL=PAL[0],UNDO=null,TT=null,CONF=null;
S.sel=dk(new Date());
S.month=new Date(new Date().getFullYear(),new Date().getMonth(),1);

function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Storage is full. Try a smaller image or remove one.')}}

/* ================= recurrence engine ================= */
function recActive(i){const r=i&&i.recurrence;return !!(r&&r.freq&&r.freq!=='none')}
function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysBetween(a,b){return Math.round((sod(b)-sod(a))/864e5)}
function monthsBetween(a,b){return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())}
function nthWeekdayDate(y,m,n,wd){const f=new Date(y,m,1);const day=1+((wd-f.getDay()+7)%7)+(n-1)*7;const d=new Date(y,m,day);return d.getMonth()===m?d:null}
function nthInMonth(d,wd){if(d.getDay()!==wd)return 0;return Math.floor((d.getDate()-1)/7)+1}
function isSkipped(i,d){return (i.exceptions||[]).indexOf(dk(d))>-1}
function occursOnDate(i,d){
  if(!i.due)return false;
  const base=new Date(i.due);if(isNaN(base))return false;
  const bd=sod(base),dd=sod(d);
  if(dd<bd)return false;
  if(!recActive(i))return dd.getTime()===bd.getTime();
  if(isSkipped(i,dd))return false;
  const r=i.recurrence;
  if(r.until){const u=new Date(r.until+'T23:59:59');if(!isNaN(u)&&dd>u)return false}
  const iv=Math.max(1,parseInt(r.interval,10)||1);
  if(r.freq==='daily')return daysBetween(bd,dd)%iv===0;
  if(r.freq==='weekly'){
    const wd=(Array.isArray(r.weekdays)&&r.weekdays.length)?r.weekdays:[bd.getDay()];
    if(wd.indexOf(dd.getDay())<0)return false;
    const a=new Date(bd);a.setDate(bd.getDate()-bd.getDay());
    const b=new Date(dd);b.setDate(dd.getDate()-dd.getDay());
    return (Math.round((b-a)/(864e5*7)))%iv===0;
  }
  if(r.freq==='monthly'){
    if(monthsBetween(bd,dd)%iv!==0)return false;
    if(r.monthlyMode==='nth'){
      const n=parseInt(r.nth,10)||1,wd=parseInt(r.nthWeekday,10);
      if(isNaN(wd)||dd.getDay()!==wd)return false;
      return nthInMonth(dd,wd)===n;
    }
    return dd.getDate()===bd.getDate();
  }
  if(r.freq==='yearly'){
    if((dd.getFullYear()-bd.getFullYear())%iv!==0)return false;
    return dd.getMonth()===bd.getMonth()&&dd.getDate()===bd.getDate();
  }
  return dd.getTime()===bd.getTime();
}
function occAt(i,d){const base=new Date(i.due);const o=new Date(d);o.setHours(base.getHours(),base.getMinutes(),0,0);return o}
function occurrencesInRange(i,from,to){
  if(!i.due)return[];
  const base=new Date(i.due);if(isNaN(base))return[];
  if(!recActive(i))return (base>=from&&base<=to)?[base]:[];
  const t=sod(to),cnt=parseInt(i.recurrence.count,10)||0;
  let start=sod(base);
  if(!cnt&&sod(from)>start)start=sod(from);
  const out=[];let d=new Date(start),n=0,guard=0;
  while(d<=t&&guard++<4000){
    if(occursOnDate(i,d)){n++;if(!cnt||n<=cnt)out.push(occAt(i,d));else break}
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  }
  return out.filter(x=>x>=from&&x<=to);
}
function expandRange(from,to){
  const out=[];
  D.items.forEach(i=>occurrencesInRange(i,from,to).forEach(d=>out.push({item:i,date:d,key:dk(d)})));
  return out.sort((a,b)=>a.date-b.date);
}
function itemsOnDay(k){
  const from=new Date(k+'T00:00'),to=new Date(k+'T23:59:59');
  const seen={},out=[];
  expandRange(from,to).forEach(o=>{if(!seen[o.item.id]){seen[o.item.id]=1;out.push(o.item)}});
  return out;
}
function recSummary(i){
  const r=i.recurrence;if(!recActive(i))return '';
  const iv=parseInt(r.interval,10)||1;
  if(r.freq==='daily')return iv>1?'Every '+iv+' days':'Daily';
  if(r.freq==='weekly'){
    const wd=(r.weekdays||[]).slice().sort().map(d=>WDAYS[d]);
    return (iv>1?'Every '+iv+' weeks':'Weekly')+(wd.length?' on '+wd.join(', '):'');
  }
  if(r.freq==='monthly'){
    if(r.monthlyMode==='nth')return (iv>1?'Every '+iv+' months':'Monthly')+' on the '+['','1st','2nd','3rd','4th','5th'][parseInt(r.nth,10)||1]+' '+WDAYS[parseInt(r.nthWeekday,10)];
    return iv>1?'Every '+iv+' months':'Monthly';
  }
  if(r.freq==='yearly')return iv>1?'Every '+iv+' years':'Yearly';
  return '';
}
function skipOccurrence(id,k){

// Google sync uses the user's Apps Script web app. Requests are sent as
// text/plain so the endpoint can accept them without a browser CORS preflight.
const GOOGLE_SYNC_URL='https://script.google.com/macros/s/AKfycbxF-v0PypnUbO-h9mPWKc5E8LIjJUe2WosWHY2C-Le2j4lpYwtdY1EBE06u0Dh64vP4Yw/exec';
const GOOGLE_SYNC_TOKEN='flowstate-2026-private-7Kq9m2';
function googlePayload(action,item,id){
  const payload={token:GOOGLE_SYNC_TOKEN,action};
  if(item){
    const copy={...item};
    // Send an unambiguous instant to Apps Script while keeping the local
    // date-time value untouched in FlowState's own storage.
    if(copy.due){const d=new Date(copy.due);copy.due=isNaN(d)?null:d.toISOString()}
    payload.item=copy;
  }
  if(id)payload.id=id;
  return JSON.stringify(payload);
}
function sendGoogleSync(action,item,id){
  if(!D.settings.googleSync)return;
  const body=googlePayload(action,item,id);
  if(!navigator.onLine){
    D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];
    D.settings.pendingGoogleSync.push(body);save();return;
  }
  fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,keepalive:true})
    .catch(()=>{D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];D.settings.pendingGoogleSync.push(body);save()});
}
function flushGoogleSync(){
  if(!D.settings.googleSync||!navigator.onLine)return;
  const q=D.settings.pendingGoogleSync||[];if(!q.length)return;
  D.settings.pendingGoogleSync=[];save();
  q.forEach(body=>fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,keepalive:true}).catch(()=>{D.settings.pendingGoogleSync=D.settings.pendingGoogleSync||[];D.settings.pendingGoogleSync.push(body);save()}));
}
function connectGoogleSync(){
  D.settings.googleSync=true;save();
  const pending=D.items.slice();
  pending.forEach(item=>sendGoogleSync('upsert',item));
  render();toast('Google sync requests sent for '+pending.length+' items');
}
function disconnectGoogleSync(){
  D.settings.googleSync=false;save();render();toast('Automatic Google sync paused');
}
function testGoogleSync(){
  if(!D.settings.googleSync){toast('Connect Google sync first');return}
  const body=JSON.stringify({token:GOOGLE_SYNC_TOKEN,action:'test'});
  fetch(GOOGLE_SYNC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body,keepalive:true})

}

function hold(el,tap,long){
  let t,fired=false,skip=false;
  el.addEventListener('pointerdown',e=>{skip=!!e.target.closest('button');fired=false;clearTimeout(t);t=setTimeout(()=>{fired=true;long()},500)});
  el.addEventListener('pointerup',()=>{clearTimeout(t);if(!fired&&!skip)tap()});
  el.addEventListener('pointerleave',()=>clearTimeout(t));
  el.addEventListener('pointercancel',()=>clearTimeout(t));
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

function exportData(){sheet(`<h2>Backup</h2><p class="empty">Copy this text and keep it somewhere safe. Use Import data to restore it.</p><textarea id="bk" style="min-height:260px">${esc(JSON.stringify(D))}</textarea><div class="row"><button class="primary" onclick="copyBk()">Copy</button><button onclick="closeSheet()">Close</button></div>`)}

function icsFor(id){
  const i=D.items.find(x=>x.id===id);if(!i||!i.due)return;
  const s=new Date(i.due),e=new Date(s.getTime()+36e5),p=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlowState//EN','BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title,'DESCRIPTION:'+(i.body||'').replace(/\s+/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  sheet(`<h2>Calendar file</h2><p class="empty">Download the file and open it to add this to your calendar app. If the download does nothing in this preview, copy the text into a file named event.ics.</p><textarea id="bk" style="min-height:200px">${esc(ics)}</textarea><div class="row"><button class="primary" onclick="dlIcs()">Download .ics</button><button onclick="copyBk()">Copy</button><button onclick="openDetail('${id}')">Back</button></div>`);
}
function dlIcs(n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#bk').value],{type:'text/calendar'}));a.download=n||'event.ics';document.body.appendChild(a);a.click();a.remove()}

let FOC=null;

function showFocus(){sheet(`<h2>${FOC.work?'Focus':'Break'}</h2><p class="big" id="ftime">${fmtDur(FOC.left*1000)}</p><div class="row"><button class="primary" onclick="focusToggle()">${FOC.iv?'Pause':'Start'}</button><button onclick="focusSwap()">Skip to ${FOC.work?'break':'focus'}</button><button onclick="focusReset()">Reset</button><button onclick="closeSheet()">Hide</button></div><p class="empty">Runs while this page is open.</p>`)}
function focusTick(){
  if(!FOC)return;

function exportReminders(){
  const p=n=>String(n).padStart(2,'0');
  const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FlowState//EN'];
  D.items.filter(i=>i.due&&!i.done&&!isNaN(new Date(i.due))).forEach(i=>{
    const s=new Date(i.due),e=new Date(s.getTime()+36e5);
    L.push('BEGIN:VEVENT','UID:'+i.id+'@flowstate','DTSTART:'+f(s),'DTEND:'+f(e),'SUMMARY:'+i.title);
    (i.reminders||[]).forEach(m=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+i.title,'TRIGGER:-PT'+m+'M','END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  sheet(`<h2>Reminders file</h2><p class="empty">Open this file to add your upcoming items and their reminders to your calendar app. Those reminders fire even when FlowState is closed. Export again after you add new items.</p><textarea id="bk" style="min-height:200px">${esc(L.join('\r\n'))}</textarea><div class="row"><button class="primary" onclick="dlIcs('flowstate-reminders.ics')">Download .ics</button><button onclick="copyBk()">Copy</button><button onclick="closeSheet()">Close</button></div>`);
}

function pickClassImg(file){
  if(!file)return toast('No picture chosen');
  const fr=new FileReader();
  fr.onerror=()=>toast('Could not read that file');
  fr.onload=()=>{const im=new Image();im.onerror=()=>toast('That picture will not open. Try a JPG or PNG.');im.onload=()=>{const sc=Math.min(1,256/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);FORM.img=c.toDataURL('image/png');const pv=$('#f-prev');if(pv)pv.innerHTML='<img src="'+FORM.img+'" style="width:64px;height:64px;object-fit:cover;border-radius:50%">'};im.src=fr.result};
  fr.readAsDataURL(file);
}
function addNotif(text){
  D.notifs.push({id:uid(),text,time:Date.now(),read:false});
  D.notifs=D.notifs.slice(-100);save();updateBell();
  if(!D.dnd){
    toast(text);
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('FlowState',{body:text})}catch(e){}
  }
}
function askPerm(){
  try{Notification.requestPermission().then(p=>toast('Browser alerts: '+p))}catch(e){toast('Browser alerts are not supported here')}
}
function tick(){
  const now=Date.now();let ch=false;
  D.items.forEach(i=>{
    if(!i.due||!i.reminders||!i.reminders.length)return;
    const due=new Date(i.due).getTime();if(isNaN(due))return;
    i.reminders.forEach(m=>{
      const k=i.id+':'+m,at=due-m*6e4;
      if(D.fired[k]||now<at)return;
      D.fired[k]=1;ch=true;
      if(now-at<6e5)addNotif(i.title+' starts in '+m+' min');
    });
  });
  if(ch)save();
}

function rail_init(){
  $('#rail').onclick=e=>{
    const b=e.target.closest('[data-tab]');if(!b)return;
    const t=b.dataset.tab;
    if(t===S.tab){S.collapsed=!S.collapsed;S.drop=!S.collapsed}
    else{S.tab=t;S.cls=null;S.collapsed=false;S.bubble=null;S.enter=true}
    render();
  };
  let ty=null;const nav=$('#rail');
  nav.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
  nav.addEventListener('touchend',e=>{if(ty===null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)>60)go(dy<0?1:-1)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();return}
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.key==='ArrowDown')go(1);
  if(e.key==='ArrowUp')go(-1);
});

const cv=$('#blobs'),cx=cv.getContext('2d');
const BL=[[0,0,230,'#ff8fa3'],[1,0,200,'#9db4f0'],[0,1,240,'#8fd3a8'],[1,1,260,'#c39bf0'],[.5,1,160,'#f7c77a'],[.5,0,150,'#7fd6e8']];
let W=0,H=0,T=0;
let PARTS=[];
const ANIMS={bubbles:'Lava bubbles',waves:'Soft waves',stars:'Floating dots',off:'Off'};
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;seedParts()}
function seedParts(){PARTS=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*4,v:.2+Math.random()*.8,c:PAL[Math.floor(Math.random()*PAL.length)]}))}
function drawBubbles(){
  BL.forEach(([fx,fy,r,c],k)=>{
    const x=fx*W+Math.sin(T*.004+k*2)*70,y=fy*H+Math.cos(T*.005+k)*55;
    const g=cx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c+'aa');g.addColorStop(1,c+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,Math.PI*2);cx.fill();
  });
}
function drawWaves(){
  for(let k=0;k<3;k++){
    cx.beginPath();cx.moveTo(0,H);
    for(let x=0;x<=W;x+=20){cx.lineTo(x,H*(.78+k*.07)+Math.sin(x*.008+T*.02+k*1.5)*35)}
    cx.lineTo(W,H);cx.closePath();
    cx.fillStyle=PAL[(k+2)%PAL.length]+'66';cx.fill();
  }
}
function drawDots(sp){
  PARTS.forEach(p=>{
    p.y-=p.v*.0015*sp;if(p.y<0){p.y=1;p.x=Math.random()}
    cx.fillStyle=p.c+'cc';cx.beginPath();cx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2);cx.fill();
  });
}
function frame(){
  const sp=D.settings.reduce?0:D.settings.speed;T+=sp;
  cx.clearRect(0,0,W,H);
  const a=D.settings.anim||'bubbles';
  if(a==='bubbles')drawBubbles();
  else if(a==='waves')drawWaves();
  else if(a==='stars')drawDots(sp);
  requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
resize();rail_init();clock();render();tick();flushGoogleSync();
setInterval(tick,15000);setInterval(clock,1000);
requestAnimationFrame(frame);
</script>
